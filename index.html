<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Directory File Listing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }
    ul {
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Carlos Files</h2>
  <ul id="files">Loading files...</ul>

  <script>
    async function loadDirectory() {
      const listElement = document.getElementById('files');

      try {
        // Fetch the directory root from the web server
        const response = await fetch('.');
        const htmlText = await response.text();

        // Parse the returned HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        // Extract all anchor links
        const links = Array.from(doc.querySelectorAll('a'));
        listElement.innerHTML = '';

        links.forEach(link => {
          const href = link.getAttribute('href');
          const name = link.textContent.trim();

          // Exclude parent directory links and self
          if (href && href !== '../' && href !== './' && href !== 'index.html') {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = href;
            a.textContent = name;
            li.appendChild(a);
            listElement.appendChild(li);
          }
        });

        if (listElement.children.length === 0) {
          listElement.innerHTML = '<li>No files found or directory indexing is disabled on the server.</li>';
        }

      } catch (error) {
        listElement.innerHTML = '<li>Error loading directory listing. Ensure you are running on a web server with directory listing enabled.</li>';
        console.error(error);
      }
    }

    loadDirectory();
  </script>

</body>
</html>
