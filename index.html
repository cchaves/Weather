<?php
/* --------------------------------------------------------------
   Carlos Projects – Auto‑generated file list
   --------------------------------------------------------------
   This script:
   1. Scans the $baseDir directory.
   2. Filters out hidden files (names starting with a dot) and
      the script itself.
   3. Sorts the entries alphabetically.
   4. Emits a clean HTML page with clickable links.
   -------------------------------------------------------------- */

$baseDir   = __DIR__ . 'https://cchaves.github.io/Weather';      // <-- change if your folder lives elsewhere
$baseUrl   = 'Weather/';                // URL path that matches $baseDir
$ignore    = ['index.php', '.htaccess']; // files you never want to expose

// Helper: safely escape a string for HTML output
function h($string) {
    return htmlspecialchars($string, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
}

// Gather the list of files
$files = [];
if (is_dir($baseDir) && $dh = opendir($baseDir)) {
    while (($file = readdir($dh)) !== false) {
        // Skip . , .. , hidden files, and anything in $ignore
        if ($file[0] === '.' || in_array($file, $ignore, true)) {
            continue;
        }
        $fullPath = $baseDir . '/' . $file;
        // Only regular files (skip sub‑folders – add extra logic if you need recursion)
        if (is_file($fullPath)) {
            $files[] = $file;
        }
    }
    closedir($dh);
    sort($files, SORT_NATURAL | SORT_FLAG_CASE);
}
?>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Carlos Projects</title>
    <style>
        body   { font-family: Arial, Helvetica, sans-serif; margin: 2rem; }
        h1     { color: #333; }
        ul     { list-style: none; padding: 0; }
        li a   { text-decoration: none; color: #0066cc; }
        li a:hover { text-decoration: underline; }
        .empty { color: #777; font-style: italic; }
    </style>
</head>
<body>
    <h1>Carlos Projects</h1>

    <?php if (empty($files)): ?>
        <p class="empty">No files found in the projects folder.</p>
    <?php else: ?>
        <ul>
            <?php foreach ($files as $file): ?>
                <li>
                    <a href="<?= h($baseUrl . $file); ?>" target="_blank">
                        <?= h($file); ?>
                    </a>
                </li>
            <?php endforeach; ?>
        </ul>
    <?php endif; ?>
</body>
</html>
